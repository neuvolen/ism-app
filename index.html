<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ISM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');
:root{--k:#0d0d0d;--w:#f7f7f5;--g:#6b7280;--b:#e5e5e3;--bl:#1a5fa8;--s:#fff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Inter',sans-serif;background:var(--w);color:var(--k);font-size:14px;}

.hdr{background:var(--k);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:#fff;}
.logo b{color:var(--bl);font-weight:400;}
.sw{display:flex;background:#1a1a1a;border-radius:7px;padding:3px;gap:2px;}
.swb{padding:5px 13px;border-radius:5px;font-size:12px;font-weight:700;border:none;cursor:pointer;background:transparent;color:#555;transition:all .2s;}
.swb.on{background:var(--bl);color:#fff;}

.scr{display:none;} .scr.on{display:block;}

/* ── КЛИЕНТ ── */
.proj-hdr{background:var(--k);padding:14px 16px 0;}
.proj-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;}
.ptabs{display:flex;gap:6px;padding-bottom:14px;overflow-x:auto;scrollbar-width:none;}
.ptabs::-webkit-scrollbar{display:none;}
.ptab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;border:1.5px solid rgba(255,255,255,.15);cursor:pointer;background:transparent;color:rgba(255,255,255,.4);transition:all .2s;flex-shrink:0;}
.ptab.on{background:var(--bl);border-color:var(--bl);color:#fff;}

.viewer{background:var(--k);position:relative;}
.slides-wrap{overflow:hidden;}
.slides{display:flex;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform;}
.slide{min-width:100%;padding:0 16px 16px;display:flex;flex-direction:column;align-items:center;}
.img-wrap{width:100%;max-width:400px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);position:relative;aspect-ratio:4/3;}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.img-lbl{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.85);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.5px;}
.img-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);}
.spin{width:24px;height:24px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--bl);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

.nav-row{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0;}
.dots{display:flex;gap:5px;}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .2s;}
.dot.on{background:var(--bl);width:16px;border-radius:3px;}
.arr{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.hinfo{margin:0 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
.hn{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;line-height:1;}
.hl{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px;}

.sect{background:var(--s);margin:10px 14px 0;border-radius:14px;padding:14px;border:1px solid var(--b);}
.st{font-size:10px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}

.steps{display:flex;position:relative;}
.steps::before{content:'';position:absolute;top:14px;left:14px;right:14px;height:2px;background:var(--b);z-index:0;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;}
.sdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--b);background:#fff;color:var(--g);margin-bottom:5px;}
.sdot.done{background:var(--k);border-color:var(--k);color:#fff;}
.sdot.now{background:var(--bl);border-color:var(--bl);color:#fff;box-shadow:0 0 0 3px rgba(26,95,168,.2);}
.slbl{font-size:9px;color:var(--g);text-align:center;line-height:1.3;}
.slbl.act{color:var(--k);font-weight:700;}

.prow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--b);font-size:13px;}
.prow:last-child{border:none;}
.pl{color:var(--g);} .pv{font-weight:600;}

.mgr{background:var(--k);margin:10px 14px 0;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;color:#fff;}
.mav{width:42px;height:42px;background:var(--bl);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.mn{font-weight:700;font-size:14px;} .mr{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px;}
.mc{background:rgba(255,255,255,.1);border:none;border-radius:9px;width:38px;height:38px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.facts{margin:10px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fact{background:var(--s);border:1px solid var(--b);border-radius:13px;padding:13px;}
.fn{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--k);line-height:1;}
.fl{font-size:11px;color:var(--g);margin-top:2px;line-height:1.4;}

.calc{background:var(--s);margin:10px 14px 0;border-radius:14px;padding:14px;border:1px solid var(--b);}
.ct{font-weight:700;font-size:14px;margin-bottom:12px;}
.cl{font-size:12px;color:var(--g);margin-bottom:4px;}
input[type=range]{width:100%;accent-color:var(--k);margin:2px 0;}
.cv{font-size:13px;font-weight:700;margin:4px 0 10px;}
.cr{background:var(--w);border-radius:9px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;}
.crl{font-size:11px;color:var(--g);} .crp{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--k);line-height:1;}
.cco{font-size:11px;color:var(--g);margin-top:6px;}

.cta{margin:10px 14px 30px;background:var(--k);border-radius:14px;padding:16px;color:#fff;text-align:center;cursor:pointer;transition:transform .15s;}
.cta:active{transform:scale(.98);}
.ctt{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:3px;}
.cts{font-size:11px;color:rgba(255,255,255,.4);}

/* ── АДМИН ── */
.met{display:grid;grid-template-columns:repeat(4,1fr);background:var(--k);padding:0 14px 14px;gap:7px;}
.mc2{background:#1a1a1a;border-radius:11px;padding:11px 8px;text-align:center;}
.mn2{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;line-height:1;}
.ml{font-size:10px;color:#444;margin-top:2px;}
.chips{display:flex;gap:6px;padding:10px 14px 6px;overflow-x:auto;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid var(--b);cursor:pointer;white-space:nowrap;background:#fff;color:var(--k);transition:all .2s;}
.chip.on{background:var(--k);color:#fff;border-color:var(--k);}
.leads{padding:4px 14px 80px;display:flex;flex-direction:column;gap:7px;}
.lcard{background:#fff;border-radius:13px;padding:13px;border:1px solid var(--b);cursor:pointer;transition:transform .15s;position:relative;}
.lcard:active{transform:scale(.98);}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;}
.lname{font-weight:700;font-size:15px;} .ldate{font-size:11px;color:var(--g);margin-top:2px;}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;flex-shrink:0;}
.b0{background:#eff6ff;color:#2563eb;} .b1{background:#fefce8;color:#ca8a04;}
.b2{background:#f0fdf4;color:#16a34a;} .b3{background:#faf5ff;color:#7c3aed;}
.b4{background:#ecfeff;color:#0e7490;} .b5{background:#f0fdf4;color:#15803d;} .b6{background:#f9fafb;color:#6b7280;}
.ltags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.tag{background:var(--w);border:1px solid var(--b);padding:2px 7px;border-radius:5px;font-size:11px;font-weight:500;}
.tag.u{background:#fff1f0;border-color:#fca5a5;color:#dc2626;}
.ldot{position:absolute;top:11px;right:11px;width:7px;height:7px;background:#ef4444;border-radius:50%;}
.lphone{font-size:12px;color:var(--bl);font-weight:600;}

.det{display:none;position:fixed;inset:0;background:var(--w);z-index:200;overflow-y:auto;}
.det.on{display:block;}
.dhdr{background:var(--k);padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;}
.back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
.dtl{font-family:'Bebas Neue',sans-serif;font-size:21px;color:#fff;letter-spacing:1px;}
.dbody{padding:12px;display:flex;flex-direction:column;gap:9px;}
.blk{background:#fff;border-radius:13px;padding:13px;border:1px solid var(--b);}
.btl{font-size:10px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px;}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--b);font-size:13px;}
.row:last-child{border:none;}
.rl{color:var(--g);} .rv{font-weight:600;text-align:right;} .rv.bl{color:var(--bl);}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.sopt{padding:8px 6px;border-radius:9px;font-size:11px;font-weight:700;border:2px solid transparent;cursor:pointer;text-align:center;transition:all .2s;}
.sopt.on{border-color:var(--k)!important;}
.acts{display:flex;flex-direction:column;gap:7px;}
.abtn{padding:13px;border-radius:11px;font-size:14px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s;}
.abtn:active{transform:scale(.97);}
.a1{background:#16a34a;color:#fff;} .a2{background:var(--bl);color:#fff;} .a3{background:var(--k);color:#fff;}

.empty{text-align:center;padding:40px 20px;}
.ei{font-size:36px;margin-bottom:10px;} .et{font-weight:700;font-size:15px;margin-bottom:5px;} .es{font-size:13px;color:var(--g);}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--k);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">IS<b>M</b></div>
  <div class="sw" id="sw">
    <button class="swb on" onclick="setMode('admin')">Админ</button>
    <button class="swb" onclick="setMode('client')">Клиент</button>
  </div>
</div>

<!-- КЛИЕНТ -->
<div id="cScr" class="scr">
  <div id="cBody"></div>
</div>

<!-- АДМИН -->
<div id="aScr" class="scr on">
  <div class="met">
    <div class="mc2"><div class="mn2" id="mh">0</div><div class="ml">Горячих</div></div>
    <div class="mc2"><div class="mn2" id="mw">0</div><div class="ml">В работе</div></div>
    <div class="mc2"><div class="mn2" id="mm">0</div><div class="ml">Замеры</div></div>
    <div class="mc2"><div class="mn2" id="md">0</div><div class="ml">Готово</div></div>
  </div>
  <div class="chips">
    <div class="chip on" onclick="filt('all',this)">Все</div>
    <div class="chip" onclick="filt('new',this)">Новые</div>
    <div class="chip" onclick="filt('working',this)">В работе</div>
    <div class="chip" onclick="filt('meeting',this)">Замер</div>
    <div class="chip" onclick="filt('contract',this)">Договор</div>
    <div class="chip" onclick="filt('done',this)">Готово</div>
  </div>
  <div class="leads" id="leads">
    <div class="empty"><div class="ei">⏳</div><div class="et">Загрузка...</div></div>
  </div>
</div>

<!-- ДЕТАЛИ -->
<div class="det" id="det">
  <div class="dhdr"><button class="back" onclick="closeDet()">←</button><div class="dtl" id="dttl">Лид</div></div>
  <div class="dbody" id="dbdy"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = 'https://neuvolen.github.io/ism-app/';
const GAS  = 'https://script.google.com/macros/s/AKfycbwnyFOOIqSroC2sNYsWQ8iZ24oZqueh0v1mz1rR1lH4RLXqOZXY5uIaFLvV-ocDVEyv/exec';
const ADMINS = ['453800951'];

const PROJECTS = [
  { name:'Дом 1', area:'143 м²', rooms:'4 комнаты', price:'от 14.3 млн ₸', size:'13×15.6 м', floors:'1 этаж',
    views:[{l:'ФАСАД',f:'h1_3d'},{l:'КОНСТРУКЦИЯ',f:'h1_panels'},{l:'ПЛАНИРОВКА',f:'h1_plan'}] },
  { name:'Дом 2', area:'75 м²', rooms:'3 комнаты', price:'от 7.5 млн ₸', size:'15.6×10.4 м', floors:'1 этаж',
    views:[{l:'ФАСАД',f:'h2_3d'},{l:'КОНСТРУКЦИЯ',f:'h2_panels'},{l:'ПЛАНИРОВКА',f:'h2_plan'}] },
  { name:'Дом 3', area:'100 м²', rooms:'3 комнаты', price:'от 10 млн ₸', size:'По проекту', floors:'1 этаж',
    views:[{l:'ФАСАД',f:'h3_3d'},{l:'КОНСТРУКЦИЯ',f:'h3_panels'},{l:'ПЛАНИРОВКА',f:'h3_plan'}] },
];

const STATUSES = [
  {key:'new',      label:'Новый',        cls:'b0',bg:'#eff6ff',color:'#2563eb'},
  {key:'working',  label:'В работе',     cls:'b1',bg:'#fefce8',color:'#ca8a04'},
  {key:'meeting',  label:'Замер',        cls:'b2',bg:'#f0fdf4',color:'#16a34a'},
  {key:'contract', label:'Договор',      cls:'b3',bg:'#faf5ff',color:'#7c3aed'},
  {key:'building', label:'Строительство',cls:'b4',bg:'#ecfeff',color:'#0e7490'},
  {key:'done',     label:'Готово',       cls:'b5',bg:'#f0fdf4',color:'#15803d'},
  {key:'reject',   label:'Отказ',        cls:'b6',bg:'#f9fafb',color:'#6b7280'},
];
const STEPS = ['Заявка','В работе','Замер','Договор','Стройка','Готово'];
const S2S = {new:0,working:1,meeting:2,contract:3,building:4,done:5};

let tg = window.Telegram && window.Telegram.WebApp;
let myUid=null, isAdmin=false;
let allLeads=[], curF='all', curLead=null;
let curP=0, curV=0, tsX=0;

(function init(){
  if(tg){tg.ready();tg.expand();tg.setHeaderColor('#0d0d0d');}
  if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){
    myUid=String(tg.initDataUnsafe.user.id);
    isAdmin=ADMINS.includes(myUid);
  } else { isAdmin=true; }
  if(!isAdmin){
    document.getElementById('sw').style.display='none';
    setMode('client');
  } else {
    loadLeads();
  }
  if(tg) tg.BackButton.onClick(function(){
    if(document.getElementById('det').classList.contains('on')) closeDet();
  });
})();

function setMode(m){
  document.querySelectorAll('.swb').forEach(function(b,i){b.classList.toggle('on',(i===0&&m==='admin')||(i===1&&m==='client'));});
  document.getElementById('aScr').classList.toggle('on',m==='admin');
  document.getElementById('cScr').classList.toggle('on',m==='client');
  if(m==='client') buildClient();
  if(m==='admin'&&!allLeads.length) loadLeads();
}

// ═══ КЛИЕНТ ═══
function buildClient(){
  var myLead = myUid ? allLeads.find(function(l){return l.id===myUid;}) : null;
  var step = myLead ? (S2S[myLead.status]||0) : 0;
  var html = buildViewer() + buildSteps(step) + buildProfile(myLead) + buildMgr() + buildFacts() + buildCalc() + buildCTA();
  document.getElementById('cBody').innerHTML = html;
  // Навешиваем события после рендера
  var sl = document.getElementById('asl');
  if(sl) sl.oninput = function(){ calcUpd(this.value); };
  setupTouch();
  goView(0, false);
}

function buildViewer(){
  var p = PROJECTS[curP];
  var tabs = PROJECTS.map(function(pr,i){
    return '<button class="ptab'+(i===curP?' on':'')+'" onclick="switchP('+i+',this)">'+pr.name+' · '+pr.area+'</button>';
  }).join('');
  var slides = p.views.map(function(v){
    return '<div class="slide">'+
      '<div class="img-wrap">'+
        '<div class="img-loading"><div class="spin"></div></div>'+
        '<img src="'+BASE+v.f+'.jpg" alt="'+v.l+'" loading="lazy" onload="this.previousElementSibling.style.display=\'none\'" onerror="this.previousElementSibling.style.display=\'none\'">'+
        '<div class="img-lbl">'+v.l+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
  var dots = p.views.map(function(_,i){
    return '<div class="dot'+(i===curV?' on':'')+'" onclick="goView('+i+')"></div>';
  }).join('');
  return '<div class="proj-hdr">'+
    '<div class="proj-lbl">Проекты ISM — CUBEX</div>'+
    '<div class="ptabs">'+tabs+'</div>'+
  '</div>'+
  '<div class="viewer" id="viewer">'+
    '<div class="slides-wrap">'+
      '<div class="slides" id="slides">'+slides+'</div>'+
    '</div>'+
    '<div class="nav-row">'+
      '<div class="arr" onclick="prevV()">←</div>'+
      '<div class="dots" id="dots">'+dots+'</div>'+
      '<div class="arr" onclick="nextV()">→</div>'+
    '</div>'+
    '<div class="hinfo">'+
      '<div><div class="hn">'+p.area+'</div><div class="hl">площадь</div></div>'+
      '<div><div class="hn">'+p.rooms+'</div><div class="hl">комнаты</div></div>'+
      '<div><div class="hn">'+p.price+'</div><div class="hl">стоимость</div></div>'+
    '</div>'+
  '</div>';
}

function switchP(idx, el){
  curP=idx; curV=0;
  document.querySelectorAll('.ptab').forEach(function(t){t.classList.remove('on');});
  el.classList.add('on');
  buildClient();
}

function goView(idx, anim){
  curV=idx;
  var slides=document.getElementById('slides');
  if(!slides) return;
  if(anim===false){slides.style.transition='none';}
  else{slides.style.transition='';}
  slides.style.transform='translateX(-'+idx+'00%)';
  setTimeout(function(){if(slides)slides.style.transition='';},50);
  document.querySelectorAll('.dot').forEach(function(d,i){d.classList.toggle('on',i===idx);});
}
function prevV(){goView((curV-1+PROJECTS[curP].views.length)%PROJECTS[curP].views.length);}
function nextV(){goView((curV+1)%PROJECTS[curP].views.length);}

function setupTouch(){
  var v=document.getElementById('viewer');
  if(!v) return;
  v.ontouchstart=function(e){tsX=e.changedTouches[0].clientX;};
  v.ontouchend=function(e){
    var dx=e.changedTouches[0].clientX-tsX;
    if(Math.abs(dx)>40){if(dx<0)nextV();else prevV();}
  };
}

function buildSteps(step){
  var dots=STEPS.map(function(s,i){
    var c=i<step?'done':i===step?'now':'';
    return '<div class="step">'+
      '<div class="sdot '+c+'">'+(i<step?'✓':(i+1))+'</div>'+
      '<div class="slbl'+(c?' act':'')+'">'+s+'</div>'+
    '</div>';
  }).join('');
  return '<div class="sect"><div class="st">Статус вашей заявки</div><div class="steps">'+dots+'</div></div>';
}

function buildProfile(lead){
  if(!lead) return '<div class="sect"><div class="st">Ваша анкета</div><div class="empty" style="padding:16px 0"><div class="ei">📋</div><div class="et">Анкета не заполнена</div><div class="es">Вернитесь в бот — займёт 2 минуты</div></div></div>';
  return '<div class="sect"><div class="st">Ваша анкета</div>'+
    '<div class="prow"><span class="pl">Регион</span><span class="pv">'+lead.region+'</span></div>'+
    '<div class="prow"><span class="pl">Площадь</span><span class="pv">'+lead.area+'</span></div>'+
    '<div class="prow"><span class="pl">Бюджет</span><span class="pv">'+lead.budget+'</span></div>'+
    '<div class="prow"><span class="pl">Срочность</span><span class="pv">'+lead.urgency+'</span></div>'+
  '</div>';
}

function buildMgr(){
  return '<div class="mgr">'+
    '<div class="mav">👷</div>'+
    '<div style="flex:1"><div class="mn">Фрол Валерьевич</div><div class="mr">Директор ISM · +7 708 239 35 72</div></div>'+
    '<button class="mc" onclick="location.href=\'tel:+77082393572\'">📞</button>'+
  '</div>';
}

function buildFacts(){
  return '<div class="facts">'+
    '<div class="fact"><div class="fn">9+</div><div class="fl">баллов сейсмостойкость — кирпич рушится при 4</div></div>'+
    '<div class="fact"><div class="fn">2×</div><div class="fl">дешевле кирпича при том же качестве</div></div>'+
    '<div class="fact"><div class="fn">6×</div><div class="fl">энергоэффективнее — меньше платить за тепло</div></div>'+
    '<div class="fact"><div class="fn">100%</div><div class="fl">монолит — ликвидный объект для банка</div></div>'+
  '</div>';

function buildCalc(){
  return '<div class="calc">'+
    '<div class="ct">Калькулятор стоимости</div>'+
    '<div class="cl">Площадь дома</div>'+
    '<input type="range" id="asl" min="50" max="300" value="100">'+
    '<div class="cv" id="av">100 м²</div>'+
    '<div class="cr">'+
      '<div><div class="crl">ISM монолит</div><div class="crp" id="cp">10 млн ₸</div></div>'+
      '<div style="text-align:right"><div class="crl">Кирпич</div><div class="crp" style="color:#9ca3af;text-decoration:line-through" id="cb">20 млн ₸</div></div>'+

function buildCTA(){

}

function calcUpd(v){
  document.getElementById('av').textContent=v+' м²';
  var p=v*100000,b=p*2;
  document.getElementById('cp').textContent=fmln(p);
  document.getElementById('cb').textContent=fmln(b);
  document.getElementById('cc').textContent='Экономия ~'+fmln(b-p);
}

function fmln(n){return n>=1000000?(n/1000000).toFixed(1)+' млн ₸':Math.round(n).toLocaleString('ru')+' ₸';}
function doMeeting(){if(tg&&tg.sendData)tg.sendData(JSON.stringify({action:'meeting'}));else location.href='tel:+77082393572';}

// ═══ АДМИН ═══
function loadLeads(){
  fetch(GAS+'?action=getLeads')
    .then(function(r){return r.json();})
    .then(function(d){allLeads=d.leads||[];renderAdmin();})
    .catch(function(){allLeads=demo();renderAdmin();});
}

function demo(){
  return [
    {id:'453800951',name:'Rustam Qabden',phone:'+7 702 403 5036',username:'qabdenr',
     region:'Алматы',area:'100–150 м²',budget:'50–80 млн ₸',urgency:'Сейчас',
     status:'new',date:'30.05.2026',hot:true,plot:'Да, есть',experience:'Первый дом'},
    {id:'1307494622',name:'Аdом ISM',phone:'+7 701 222 0063',username:'ADOMISM',
     region:'Алматы',area:'50–100 м²',budget:'до 30 млн ₸',urgency:'1–3 месяца',
     status:'working',date:'29.05.2026',hot:false,plot:'В процессе',experience:'Уже строил'},
  ];
}

function renderAdmin(){
  document.getElementById('mh').textContent=allLeads.filter(function(l){return l.hot;}).length;
  document.getElementById('mw').textContent=allLeads.filter(function(l){return l.status==='working';}).length;
  document.getElementById('mm').textContent=allLeads.filter(function(l){return l.status==='meeting';}).length;
  document.getElementById('md').textContent=allLeads.filter(function(l){return l.status==='done';}).length;
  renderLeads();
}

function renderLeads(){
  var f=curF==='all'?allLeads:allLeads.filter(function(l){return l.status===curF;});
  var el=document.getElementById('leads');
  if(!f.length){el.innerHTML='<div class="empty"><div class="ei">📭</div><div class="et">Нет лидов</div></div>';return;}
  el.innerHTML=f.map(function(l){
    var s=STATUSES.find(function(s){return s.key===l.status;})||STATUSES[0];
    return '<div class="lcard" onclick="openDet(\''+l.id+'\')">'+
      (l.hot?'<div class="ldot"></div>':'')+
      '<div class="lhead">'+
        '<div><div class="lname">'+l.name+'</div><div class="ldate">'+l.date+'</div></div>'+
        '<span class="badge '+s.cls+'">'+s.label+'</span>'+
      '</div>'+
      '<div class="ltags">'+
        '<span class="tag">'+l.region+'</span><span class="tag">'+l.area+'</span>'+
        '<span class="tag">'+l.budget+'</span>'+
        (l.urgency==='Сейчас'?'<span class="tag u">🔥 '+l.urgency+'</span>':'<span class="tag">'+l.urgency+'</span>')+
      '</div>'+
      '<div class="lphone">📱 '+l.phone+'</div>'+
    '</div>';
  }).join('');
}

function filt(f,el){
  curF=f;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
  el.classList.add('on');
  renderLeads();
}

function openDet(id){
  curLead=allLeads.find(function(l){return l.id===id;});
  if(!curLead) return;
  document.getElementById('dttl').textContent=curLead.name;
  var sOpts=STATUSES.map(function(s){
    return '<div class="sopt'+(s.key===curLead.status?' on':'')+'" '+
      'style="background:'+s.bg+';color:'+s.color+'" '+
      'onclick="pickS(\''+s.key+'\',this)">'+s.label+'</div>';
  }).join('');
  document.getElementById('dbdy').innerHTML=
    '<div class="blk"><div class="btl">Контакты</div>'+
      '<div class="row"><span class="rl">Имя</span><span class="rv">'+curLead.name+'</span></div>'+
      '<div class="row"><span class="rl">Телефон</span><span class="rv bl">'+curLead.phone+'</span></div>'+
      (curLead.username?'<div class="row"><span class="rl">Telegram</span><span class="rv bl">@'+curLead.username+'</span></div>':'')+
    '</div>'+
    '<div class="blk"><div class="btl">Анкета</div>'+
      '<div class="row"><span class="rl">Регион</span><span class="rv">'+curLead.region+'</span></div>'+
      '<div class="row"><span class="rl">Площадь</span><span class="rv">'+curLead.area+'</span></div>'+
      '<div class="row"><span class="rl">Бюджет</span><span class="rv">'+curLead.budget+'</span></div>'+
      '<div class="row"><span class="rl">Участок</span><span class="rv">'+(curLead.plot||'—')+'</span></div>'+
      '<div class="row"><span class="rl">Срочность</span><span class="rv">'+curLead.urgency+'</span></div>'+
    '</div>'+
    '<div class="blk"><div class="btl">Статус</div><div class="sgrid">'+sOpts+'</div></div>'+
    '<div class="blk"><div class="btl">Действия</div><div class="acts">'+
      '<button class="abtn a1" onclick="doCall()">📞 '+curLead.phone+'</button>'+
      (curLead.username?'<button class="abtn a2" onclick="doMsg()">✉️ @'+curLead.username+'</button>':'')+
      '<button class="abtn a3" onclick="doSave()">💾 Сохранить статус</button>'+
    '</div></div>';
  document.getElementById('det').classList.add('on');
  if(tg) tg.BackButton.show();
}

function closeDet(){document.getElementById('det').classList.remove('on');if(tg)tg.BackButton.hide();}
function pickS(key,el){document.querySelectorAll('.sopt').forEach(function(o){o.classList.remove('on');});el.classList.add('on');if(curLead)curLead.status=key;}
function doCall(){if(curLead)location.href='tel:'+curLead.phone.replace(/\s/g,'');}
function doMsg(){if(curLead&&curLead.username)window.open('https://t.me/'+curLead.username,'_blank');}
function doSave(){
  var idx=allLeads.findIndex(function(l){return l.id===curLead.id;});
  if(idx>=0)allLeads[idx]=curLead;
  fetch(GAS+'?action=updateStatus&uid='+curLead.id+'&status='+curLead.status).catch(function(){});
  renderAdmin();closeDet();showToast('✅ Сохранено');
}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}
</script>
