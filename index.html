<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ISM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

/* ── ПЕРЕМЕННЫЕ ── */
:root {
  --k: #0d0d0d;
  --w: #f4f4f2;
  --g: #888;
  --b: #e5e5e3;
  --bl: #1a5fa8;
  --s: #ffffff;
  --hot: #e74c3c;
  --green: #16a34a;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { height: 100%; }
body {
  font-family: 'Montserrat', sans-serif;
  background: var(--w);
  color: var(--k);
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ── ШАПКА ── */
.hdr {
  background: var(--k);
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: 2px; }
.logo em { color: var(--bl); font-style: normal; }
.sw { display: flex; background: #1c1c1c; border-radius: 8px; padding: 3px; }
.swb { padding: 5px 13px; border-radius: 6px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; background: transparent; color: #555; font-family: 'Montserrat', sans-serif; transition: all .2s; letter-spacing: .3px; }
.swb.on { background: var(--bl); color: #fff; }

/* ── ЭКРАНЫ ── */
.scr { display: none; }
.scr.on { display: block; }

/* ══════════════════════════
   КЛИЕНТ
══════════════════════════ */

/* HERO */
.hero {
  position: relative;
  min-height: 320px;
  display: flex; flex-direction: column; justify-content: flex-end;
  overflow: hidden;
  background: var(--k);
}
.hero-bg {
  position: absolute; inset: 0;
  background-image: url('hero_house.jpg');
  background-size: cover; background-position: center;
  opacity: .35;
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(13,13,13,.2) 0%, rgba(13,13,13,.85) 70%, #0d0d0d 100%);
}
.hero-content {
  position: relative; z-index: 1;
  padding: 20px 16px 20px;
}
.hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bl); color: #fff;
  font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
  padding: 4px 10px; border-radius: 4px; margin-bottom: 12px;
  text-transform: uppercase;
}
.hero-title {
  font-size: 26px; font-weight: 900; color: #fff;
  line-height: 1.1; margin-bottom: 10px;
  letter-spacing: -.3px;
}
.hero-proof {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
}
.proof-chip {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.8); font-size: 11px; font-weight: 600;
  padding: 4px 10px; border-radius: 20px;
}

/* Что включает */
.includes {
  background: #161616;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
}
.inc-item { display: flex; align-items: flex-start; gap: 10px; }
.inc-icon {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: rgba(26,95,168,.15); border: 1px solid rgba(26,95,168,.25);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.inc-text { font-size: 12px; color: rgba(255,255,255,.65); line-height: 1.5; }
.inc-text b { color: #fff; font-weight: 700; display: block; margin-bottom: 1px; }

/* CTA блок */
.cta-block {
  background: var(--k); padding: 14px 16px 16px;
  border-top: 1px solid #1c1c1c;
}
.cta-btn {
  width: 100%; background: var(--bl); color: #fff;
  border: none; border-radius: 12px; padding: 15px 16px;
  font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 800;
  cursor: pointer; letter-spacing: .3px; transition: all .15s; line-height: 1.2;
}
.cta-btn:active { transform: scale(.97); background: #154d8a; }
.cta-sub { display: block; font-size: 11px; font-weight: 500; opacity: .7; margin-top: 3px; }

/* ПУТЬ КЛИЕНТА */
.journey {
  background: var(--s); margin: 10px 14px 0;
  border-radius: 16px; padding: 16px; border: 1px solid var(--b);
}
.sect-title { font-size: 10px; font-weight: 800; color: var(--g); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; }
.journey-steps { display: flex; flex-direction: column; gap: 0; }
.j-step { display: flex; gap: 12px; position: relative; }
.j-step:not(:last-child)::before {
  content: ''; position: absolute;
  left: 15px; top: 34px; bottom: 0; width: 2px;
  background: var(--b);
}
.j-num {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: var(--k); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; margin-top: 2px; position: relative; z-index: 1;
}
.j-num.done { background: var(--green); }
.j-num.active { background: var(--bl); box-shadow: 0 0 0 3px rgba(26,95,168,.2); }
.j-info { flex: 1; padding-bottom: 18px; }
.j-title { font-size: 14px; font-weight: 800; margin-bottom: 2px; }
.j-desc { font-size: 12px; color: var(--g); line-height: 1.5; }

/* ВИДЕО */
.videos-section { margin: 10px 14px 0; }
.videos-scroll {
  display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 4px;
}
.videos-scroll::-webkit-scrollbar { display: none; }
.video-card {
  min-width: 160px; border-radius: 12px; overflow: hidden;
  background: var(--k); position: relative; cursor: pointer;
  flex-shrink: 0; aspect-ratio: 9/16; max-height: 220px;
  border: 1px solid var(--b);
}
.video-thumb {
  width: 100%; height: 100%; object-fit: cover; display: block;
  background: #1a1a1a;
}
.video-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 50%);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
}
.video-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.video-title { font-size: 11px; font-weight: 700; color: #fff; line-height: 1.3; }
.video-source { font-size: 10px; color: rgba(255,255,255,.5); margin-top: 2px; }

/* Заглушка видео */
.video-placeholder {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
}
.vp-icon { font-size: 32px; }
.vp-text { font-size: 10px; color: rgba(255,255,255,.4); text-align: center; padding: 0 10px; }

/* ПРОЕКТЫ */
.projects-section { margin: 10px 14px 0; }
.ptabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--b); cursor: pointer; white-space: nowrap;
  background: var(--s); color: var(--k); transition: all .2s; flex-shrink: 0;
  font-family: 'Montserrat', sans-serif;
}
.ptab.on { background: var(--k); color: #fff; border-color: var(--k); }

.viewer {
  background: var(--k); border-radius: 14px; overflow: hidden; position: relative;
}
.slides-wrap { overflow: hidden; }
.slides { display: flex; transition: transform .3s cubic-bezier(.4,0,.2,1); will-change: transform; }
.slide { min-width: 100%; position: relative; }
.slide img {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #111;
}
.slide-lbl {
  position: absolute; top: 8px; left: 8px;
  background: rgba(0,0,0,.6); color: rgba(255,255,255,.9);
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  padding: 3px 9px; border-radius: 5px; text-transform: uppercase;
}

/* Подсказка свайп — анимация */
.swipe-hint {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  animation: hintFade 2.8s ease forwards;
}
@keyframes hintFade { 0%,65%{opacity:1} 100%{opacity:0} }
.hint-pill {
  background: rgba(0,0,0,.7); border-radius: 20px; padding: 7px 14px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85);
}
.hint-arrows { font-size: 14px; color: #fff; }

.viewer-nav {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 8px 0 10px; background: var(--k);
}
.vdots { display: flex; gap: 5px; }
.vdot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.2); cursor: pointer; transition: all .2s; }
.vdot.on { background: var(--bl); width: 16px; border-radius: 3px; }
.varr { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.5); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.proj-info {
  display: grid; grid-template-columns: repeat(3,1fr);
  margin-top: 8px; gap: 1px; background: var(--b);
  border: 1px solid var(--b); border-radius: 12px; overflow: hidden;
}
.pi-c { background: var(--s); padding: 10px 8px; text-align: center; }
.pi-n { font-size: 14px; font-weight: 900; }
.pi-l { font-size: 10px; color: var(--g); margin-top: 1px; font-weight: 600; }

/* КЕЙСЫ */
.cases-section { margin: 10px 14px 0; }
.case-card {
  background: var(--s); border-radius: 14px; padding: 14px;
  border: 1px solid var(--b); margin-bottom: 8px;
}
.case-img {
  width: 100%; border-radius: 10px; aspect-ratio: 16/9; object-fit: cover;
  background: var(--w); display: block; margin-bottom: 12px;
}
.case-img-placeholder {
  width: 100%; border-radius: 10px; aspect-ratio: 16/9;
  background: var(--w); border: 2px dashed var(--b);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; margin-bottom: 12px;
}
.case-img-placeholder span { font-size: 28px; }
.case-img-placeholder p { font-size: 11px; color: var(--g); font-weight: 600; text-align: center; padding: 0 20px; }
.case-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
.case-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.ctag { background: var(--w); border: 1px solid var(--b); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
.ctag.hl { background: #eff6ff; border-color: #bfdbfe; color: var(--bl); }
.case-quote { font-size: 12px; color: var(--g); line-height: 1.6; font-style: italic; border-left: 3px solid var(--bl); padding-left: 10px; }

/* ДОВЕРИЕ */
.trust-grid { margin: 10px 14px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.trust-card { background: var(--s); border: 1px solid var(--b); border-radius: 13px; padding: 14px; }
.trust-n { font-size: 28px; font-weight: 900; color: var(--k); line-height: 1; }
.trust-l { font-size: 11px; color: var(--g); margin-top: 3px; line-height: 1.4; font-weight: 600; }

/* СЕЙСМИКА */
.seismic-section {
  background: var(--k); margin: 10px 14px 0; border-radius: 16px;
  overflow: hidden; position: relative;
}
.seismic-img { width: 100%; display: block; object-fit: cover; max-height: 200px; opacity: .6; }
.seismic-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(13,13,13,.95) 0%, transparent 60%);
  display: flex; flex-direction: column; justify-content: flex-end; padding: 16px;
}
.seismic-title { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 4px; }
.seismic-sub { font-size: 12px; color: rgba(255,255,255,.55); line-height: 1.5; }

/* МЕНЕДЖЕР */
.mgr { background: var(--k); margin: 10px 14px 0; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; color: #fff; }
.mav { width: 44px; height: 44px; background: var(--bl); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.mn { font-weight: 800; font-size: 14px; } .mr { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 2px; }
.mc { background: rgba(255,255,255,.1); border: none; border-radius: 10px; width: 42px; height: 42px; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* CTA нижняя */
.cta-footer { margin: 10px 14px 32px; }
.cta-footer-note { font-size: 11px; color: var(--g); text-align: center; margin-top: 10px; line-height: 1.6; font-weight: 500; }

/* СТАТУС */
.status-card { background: var(--s); margin: 10px 14px 0; border-radius: 14px; padding: 14px; border: 1px solid var(--b); }
.steps { display: flex; position: relative; }
.steps::before { content: ''; position: absolute; top: 13px; left: 14px; right: 14px; height: 2px; background: var(--b); z-index: 0; }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
.sdot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; border: 2px solid var(--b); background: #fff; color: var(--g); margin-bottom: 5px; }
.sdot.done { background: var(--k); border-color: var(--k); color: #fff; }
.sdot.now { background: var(--bl); border-color: var(--bl); color: #fff; box-shadow: 0 0 0 3px rgba(26,95,168,.2); }
.slbl { font-size: 9px; color: var(--g); text-align: center; line-height: 1.3; font-weight: 600; }
.slbl.act { color: var(--k); font-weight: 800; }

/* АНКЕТА */
.profile-card { background: var(--s); margin: 10px 14px 0; border-radius: 14px; padding: 14px; border: 1px solid var(--b); }
.prow { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--b); font-size: 13px; }
.prow:last-child { border: none; }
.pl { color: var(--g); font-weight: 600; } .pv { font-weight: 800; }

/* ══════════════════════════
   АДМИН
══════════════════════════ */
.met { display: grid; grid-template-columns: repeat(4,1fr); background: var(--k); padding: 0 14px 14px; gap: 7px; }
.mc2 { background: #181818; border-radius: 10px; padding: 10px 6px; text-align: center; }
.mn2 { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; }
.ml { font-size: 9px; color: #444; margin-top: 2px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
.chips { display: flex; gap: 5px; padding: 10px 14px 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1.5px solid var(--b); cursor: pointer; white-space: nowrap; background: #fff; color: var(--k); transition: all .2s; font-family: 'Montserrat', sans-serif; }
.chip.on { background: var(--k); color: #fff; border-color: var(--k); }
.leads { padding: 4px 14px 80px; display: flex; flex-direction: column; gap: 7px; }
.lcard { background: #fff; border-radius: 13px; padding: 13px; border: 1px solid var(--b); cursor: pointer; transition: transform .15s; position: relative; }
.lcard:active { transform: scale(.98); }
.lhead { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 9px; }
.lname { font-weight: 800; font-size: 15px; }
.lmeta { font-size: 11px; color: var(--g); margin-top: 2px; font-weight: 600; }
.badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.b0{background:#eff6ff;color:#2563eb;} .b1{background:#fefce8;color:#ca8a04;}
.b2{background:#f0fdf4;color:#16a34a;} .b3{background:#faf5ff;color:#7c3aed;}
.b4{background:#ecfeff;color:#0e7490;} .b5{background:#f0fdf4;color:#15803d;} .b6{background:#f9fafb;color:#6b7280;}
.ltags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tag { background: var(--w); border: 1px solid var(--b); padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; }
.tag.u { background: #fff1f0; border-color: #fca5a5; color: #dc2626; }
.ldot { position: absolute; top: 11px; right: 11px; width: 7px; height: 7px; background: var(--hot); border-radius: 50%; }
.lphone { font-size: 12px; color: var(--bl); font-weight: 700; }

/* ДЕТАЛИ */
.det { display: none; position: fixed; inset: 0; background: var(--w); z-index: 200; overflow-y: auto; }
.det.on { display: block; }
.dhdr { background: var(--k); padding: 13px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; }
.back { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
.dtl { font-size: 18px; font-weight: 800; color: #fff; }
.dbody { padding: 12px; display: flex; flex-direction: column; gap: 9px; padding-bottom: 30px; }
.blk { background: #fff; border-radius: 13px; padding: 13px; border: 1px solid var(--b); }
.btl { font-size: 10px; font-weight: 800; color: var(--g); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--b); font-size: 13px; }
.row:last-child { border: none; }
.rl { color: var(--g); font-weight: 600; } .rv { font-weight: 800; text-align: right; } .rv.bl { color: var(--bl); }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sopt { padding: 9px 6px; border-radius: 9px; font-size: 11px; font-weight: 700; border: 2px solid transparent; cursor: pointer; text-align: center; transition: all .2s; font-family: 'Montserrat', sans-serif; }
.sopt.on { border-color: var(--k) !important; }
.acts { display: flex; flex-direction: column; gap: 7px; }
.abtn { padding: 13px; border-radius: 11px; font-size: 14px; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: transform .15s; font-family: 'Montserrat', sans-serif; }
.abtn:active { transform: scale(.97); }
.a1{background:#16a34a;color:#fff;} .a2{background:var(--bl);color:#fff;} .a3{background:var(--k);color:#fff;}

/* ПРОГРЕВ в деталях */
.warm-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--b); align-items: flex-start; }
.warm-item:last-child { border: none; }
.wd { width: 36px; height: 36px; border-radius: 9px; background: var(--w); border: 1px solid var(--b); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--g); flex-shrink: 0; text-align: center; line-height: 1.2; }
.wd.sent { background: #f0fdf4; border-color: #bbf7d0; color: var(--green); font-size: 16px; }
.wi { flex: 1; }
.wt { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.ws { font-size: 11px; color: var(--g); line-height: 1.4; }
.wsend { background: var(--bl); color: #fff; border: none; border-radius: 7px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Montserrat', sans-serif; margin-top: 6px; display: inline-block; }
.wsent-label { color: var(--green); font-size: 11px; font-weight: 700; margin-top: 4px; display: block; }

/* УТИЛИТЫ */
.empty { text-align: center; padding: 36px 20px; }
.ei { font-size: 36px; margin-bottom: 10px; } .et { font-weight: 800; font-size: 15px; margin-bottom: 5px; } .es { font-size: 12px; color: var(--g); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--k); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; opacity: 0; transition: all .25s; z-index: 999; white-space: nowrap; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">IS<em>M</em></div>
  <div class="sw" id="sw">
    <button class="swb on" onclick="setMode('admin')">Админ</button>
    <button class="swb" onclick="setMode('client')">Клиент</button>
  </div>
</div>

<!-- КЛИЕНТ -->
<div id="cScr" class="scr">
  <div id="cBody"></div>
</div>

<!-- АДМИН -->
<div id="aScr" class="scr on">
  <div class="met">
    <div class="mc2"><div class="mn2" id="mh">0</div><div class="ml">Горячих</div></div>
    <div class="mc2"><div class="mn2" id="mw">0</div><div class="ml">Работа</div></div>
    <div class="mc2"><div class="mn2" id="mm">0</div><div class="ml">Замеры</div></div>
    <div class="mc2"><div class="mn2" id="md">0</div><div class="ml">Готово</div></div>

function initViewer(){
  var v = document.getElementById('viewer');
  if(!v) return;
  v.ontouchstart = function(e){ tsX = e.changedTouches[0].clientX; };
  v.ontouchend  = function(e){
    var dx = e.changedTouches[0].clientX - tsX;
    if(Math.abs(dx) > 40){
      if(dx<0) nextV(); else prevV();
      var hint = document.getElementById('shint');
      if(hint) hint.style.display = 'none';
    }
  };
}

function switchP(idx, el){
  curP=idx; curV=0;
  document.querySelectorAll('.ptab').forEach(function(t){t.classList.remove('on');});
  el.classList.add('on');
  buildClient();
}

function goView(idx, anim){
  curV = idx;
  var s = document.getElementById('slides');
  if(!s) return;
  if(anim===false){ s.style.transition='none'; }
  else { s.style.transition=''; }
  s.style.transform = 'translateX(-'+idx+'00%)';
  setTimeout(function(){ if(s) s.style.transition=''; }, 50);
  document.querySelectorAll('.vdot').forEach(function(d,i){ d.classList.toggle('on',i===idx); });
}
function prevV(){ goView((curV-1+PROJECTS[curP].views.length)%PROJECTS[curP].views.length); }
function nextV(){ goView((curV+1)%PROJECTS[curP].views.length); }

function renderLeads(){
  var f = curF==='all' ? allLeads : allLeads.filter(function(l){return l.status===curF;});
  var el = document.getElementById('leads');
  if(!f.length){ el.innerHTML='<div class="empty"><div class="ei">📭</div><div class="et">Нет лидов</div></div>'; return; }
  el.innerHTML = f.map(function(l){
    var s = STATUSES.find(function(s){return s.key===l.status;})||STATUSES[0];
    return '<div class="lcard" onclick="openDet(\''+l.id+'\')">'+
      (l.hot?'<div class="ldot"></div>':'')+
      '<div class="lhead">'+
        '<div><div class="lname">'+l.name+'</div><div class="lmeta">'+l.date+(l.time?' · '+l.time:'')+'</div></div>'+
        '<span class="badge '+s.cls+'">'+s.label+'</span>'+
      '</div>'+
      '<div class="ltags">'+
        '<span class="tag">'+l.region+'</span>'+
        '<span class="tag">'+l.area+'</span>'+
        '<span class="tag">'+l.budget+'</span>'+
        (l.urgency==='Сейчас'?'<span class="tag u">🔥 '+l.urgency+'</span>':'<span class="tag">'+l.urgency+'</span>')+
      '</div>'+
      '<div class="lphone">📱 '+l.phone+'</div>'+
    '</div>';
  }).join('');
}

function filt(f,el){
  curF=f;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
  el.classList.add('on');
  renderLeads();
}

function openDet(id){
  curLead = allLeads.find(function(l){return l.id===id;});
  if(!curLead) return;
  document.getElementById('dttl').textContent = curLead.name;

  var sOpts = STATUSES.map(function(s){
    return '<div class="sopt'+(s.key===curLead.status?' on':'')+'" '+
      'style="background:'+s.bg+';color:'+s.color+'" onclick="pickS(\''+s.key+'\',this)">'+s.label+'</div>';
  }).join('');

  var warmHtml = WARMUP.map(function(w,i){
    var sent = curLead._warm && curLead._warm[i];
    return '<div class="warm-item">'+
      '<div class="wd'+(sent?' sent':'')+'">'+( sent?'✓':w.icon)+'<br><small style="font-size:9px;font-weight:800">'+w.day+'</small></div>'+
      '<div class="wi">'+
        '<div class="wt">'+w.title+'</div>'+
        '<div class="ws">'+w.desc+'</div>'+
        (!sent
          ? '<button class="wsend" onclick="sendWarm('+i+')">Отправить</button>'
          : '<span class="wsent-label">✓ Отправлено</span>')+
      '</div>'+
    '</div>';
  }).join('');

  document.getElementById('dbdy').innerHTML =
    '<div class="blk"><div class="btl">Контакты</div>'+
      '<div class="row"><span class="rl">Имя</span><span class="rv">'+curLead.name+'</span></div>'+
      '<div class="row"><span class="rl">Телефон</span><span class="rv bl">'+curLead.phone+'</span></div>'+
      (curLead.username?'<div class="row"><span class="rl">Telegram</span><span class="rv bl">@'+curLead.username+'</span></div>':'')+
      '<div class="row"><span class="rl">Заявка</span><span class="rv">'+(curLead.date||'')+(curLead.time?' в '+curLead.time:'')+'</span></div>'+
    '</div>'+
    '<div class="blk"><div class="btl">Анкета</div>'+
      '<div class="row"><span class="rl">Регион</span><span class="rv">'+curLead.region+'</span></div>'+
      '<div class="row"><span class="rl">Площадь</span><span class="rv">'+curLead.area+'</span></div>'+
      '<div class="row"><span class="rl">Бюджет</span><span class="rv">'+curLead.budget+'</span></div>'+
      '<div class="row"><span class="rl">Участок</span><span class="rv">'+(curLead.plot||'—')+'</span></div>'+
      '<div class="row"><span class="rl">Срочность</span><span class="rv">'+curLead.urgency+'</span></div>'+
      '<div class="row"><span class="rl">Опыт</span><span class="rv">'+(curLead.experience||'—')+'</span></div>'+
    '</div>'+
    '<div class="blk"><div class="btl">Статус</div><div class="sgrid">'+sOpts+'</div></div>'+
    '<div class="blk"><div class="btl">Прогрев лида</div>'+warmHtml+'</div>'+
    '<div class="blk"><div class="btl">Действия</div><div class="acts">'+
      '<button class="abtn a1" onclick="doCall()">📞 '+curLead.phone+'</button>'+
      (curLead.username?'<button class="abtn a2" onclick="doMsg()">✉️ Написать @'+curLead.username+'</button>':'')+
      '<button class="abtn a3" onclick="doSave()">💾 Сохранить статус</button>'+
    '</div></div>';

  document.getElementById('det').classList.add('on');
  if(tg) tg.BackButton.show();
}

function closeDet(){ document.getElementById('det').classList.remove('on'); if(tg) tg.BackButton.hide(); }

function pickS(key,el){
  document.querySelectorAll('.sopt').forEach(function(o){o.classList.remove('on');});
  el.classList.add('on');
  if(curLead) curLead.status = key;
}

function doCall(){ if(curLead) location.href='tel:'+curLead.phone.replace(/\s/g,''); }
function doMsg(){  if(curLead&&curLead.username) window.open('https://t.me/'+curLead.username,'_blank'); }

function doSave(){
  var idx = allLeads.findIndex(function(l){return l.id===curLead.id;});
  if(idx>=0) allLeads[idx] = curLead;
  fetch(CFG.gas+'?action=updateStatus&uid='+curLead.id+'&status='+curLead.status).catch(function(){});
  renderAdmin(); closeDet(); showToast('✅ Статус сохранён');
}

function sendWarm(idx){
  if(!curLead._warm) curLead._warm = {};
  curLead._warm[idx] = true;
  fetch(CFG.gas+'?action=sendWarm&uid='+curLead.id+'&step='+idx).catch(function(){});
  openDet(curLead.id);
  showToast('✅ Отправлено');
}

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2500);
}

</script>
</body>
</html>
